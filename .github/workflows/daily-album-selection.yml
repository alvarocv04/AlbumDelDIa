name: Select Daily Album

on:
  schedule:
    # Ejecutar a las 21:00 UTC (22:00 Invierno / 23:00 Verano en España)
    # Adelantamos la ejecución para "pre-generar" el álbum del día siguiente y evitar colas de GitHub.
    - cron: '0 21 * * *'
  workflow_dispatch:
    # Permite ejecutar manualmente desde la pestaña de Actions para pruebas

jobs:
  select-album:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run selection script
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: node scripts/selectDailyAlbum.js
