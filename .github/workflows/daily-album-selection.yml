name: Select Daily Album

on:
  schedule:
    # Ejecutar a las 00:00 UTC todos los días
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Permite ejecutar manualmente desde la pestaña de Actions para pruebas

jobs:
  select-album:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run selection script
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: node scripts/selectDailyAlbum.js
