<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!-- Cache Control Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- App Version for Cache Busting -->
    <meta name="app-version" content="2024.12.27.1" />

    <!-- DNS Prefetch for faster CDN resolution -->
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://unpkg.com" />

    <!-- Preconnect for critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- First Input Delay Polyfill for Firebase Performance -->
    <script src="https://unpkg.com/first-input-delay@0.2.3/dist/first-input-delay.min.js"
        onerror="console.warn('FID polyfill failed to load')"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/brand/logo.png" />
    <link rel="apple-touch-icon" href="/assets/brand/logo.png" />

    <!-- Primary Meta Tags -->
    <title>Albumdeldia - El Álbum del Día</title>
    <meta name="title" content="Albumdeldia - El Álbum del Día" />
    <meta name="description"
        content="Descubre un nuevo álbum cada día. Explora música, comparte tus opiniones y lleva un registro de lo que escuchas." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://albumaldia-1.web.app/" />
    <meta property="og:title" content="Albumdeldia - El Álbum del Día" />
    <meta property="og:description"
        content="Descubre un nuevo álbum cada día. Explora música, comparte tus opiniones y lleva un registro de lo que escuchas." />
    <meta property="og:image" content="https://albumaldia-1.web.app/assets/brand/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://albumaldia-1.web.app/" />
    <meta property="twitter:title" content="Albumdeldia - El Álbum del Día" />
    <meta property="twitter:description"
        content="Descubre un nuevo álbum cada día. Explora música, comparte tus opiniones y lleva un registro de lo que escuchas." />
    <meta property="twitter:image" content="https://albumaldia-1.web.app/assets/brand/logo.png" />

    <!-- Resource Loading Error Detection -->
    <script>
        (function () {
            var loadErrors = [];
            var criticalResourcesFailed = false;

            window.addEventListener('error', function (e) {
                if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
                    var src = e.target.src || e.target.href || 'unknown';
                    loadErrors.push(src);
                    console.error('Resource failed to load:', src);

                    // Check if it's a critical resource (Tailwind or main fonts)
                    if (src.includes('tailwindcss') || src.includes('fonts.googleapis')) {
                        criticalResourcesFailed = true;
                    }
                }
            }, true);

            // After page load, check if critical resources failed
            window.addEventListener('load', function () {
                if (criticalResourcesFailed) {
                    // Check if we've already tried to reload
                    var reloadAttempts = parseInt(sessionStorage.getItem('reloadAttempts') || '0');
                    if (reloadAttempts < 2) {
                        sessionStorage.setItem('reloadAttempts', String(reloadAttempts + 1));
                        console.warn('Critical resources failed, reloading page...');
                        // Force a hard reload bypassing cache
                        location.reload(true);
                    } else {
                        console.error('Critical resources failed after multiple attempts. Please try clearing your browser cache.');
                        sessionStorage.removeItem('reloadAttempts');
                    }
                } else {
                    // Reset reload counter on successful load
                    sessionStorage.removeItem('reloadAttempts');
                }

                // Check if Tailwind loaded correctly
                setTimeout(function () {
                    if (typeof tailwind === 'undefined') {
                        console.error('Tailwind failed to initialize');
                    }
                }, 1000);
            });
        })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Theme Configuration -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "surface-dark": "#182132",
                        "surface-light": "#ffffff",
                        "card-dark": "#1c1f27",
                        "border-dark": "#282e39",
                        "accent-green": "#0bda5e",
                        "text-secondary": "#9da6b9"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                    }
                },
            },
        }
    </script>

    <!-- Google Fonts with display=swap for faster text rendering -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <style>
        /* Fallback font stack - will use system fonts if Inter fails to load */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        /* Critical fallback styles if Tailwind fails to load */
        .fallback-dark-mode {
            background-color: #101622;
            color: #ffffff;
        }

        /* Ensure text is visible even without Tailwind */
        html.dark body {
            background-color: #101622;
            color: #ffffff;
        }

        html body {
            background-color: #f6f6f8;
            color: #1e293b;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #111318;
        }

        ::-webkit-scrollbar-thumb {
            background: #282e39;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3f4756;
        }

        /* Material Symbols settings */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .fill-1 {
            font-variation-settings: 'FILL' 1;
        }

        /* Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
        }

        input[type=range]:focus {
            outline: none;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-down {
            animation: slideDown 0.2s ease-out forwards;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-zoom-in {
            animation: zoomIn 0.2s ease-out forwards;
        }
    </style>

{
  "imports": {

  }
}
</script>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white antialiased">

</html>
